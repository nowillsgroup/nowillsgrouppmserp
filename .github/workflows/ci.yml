name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, curl, openssl, fileinfo, pdo_sqlite, sqlite3, gmp, bcmath
          coverage: none

      - name: Validate composer.json
        # --no-check-lock: the committed lock was generated by the project's own toolchain;
        # flag a mismatch here without failing the build over a metadata-only edit.
        run: composer validate --no-check-publish --no-check-lock

      # vendor-dir is build/vendor (see composer.json) — install reconciles the committed
      # packages with composer.lock. DB_* keeps package:discover (post-autoload-dump) alive:
      # a custom provider registers SQLite helpers at boot and dies without a database.
      # APP_KEY is a throwaway — the real key is generated per server.
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          APP_KEY: base64:ZWzlcG39ZJ7MJZQIqVPNLnEu59x9ZhTnhUviBVXDVRU=

      - name: Run the test suite
        run: php build/vendor/bin/phpunit

      - name: Check the package build script (syntax)
        run: bash -n deploy/package-cpanel.sh

  audit:
    name: Static audit harness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PHP syntax (php-parser)
        run: |
          npm install --no-save --silent php-parser
          node deploy/dev/audit/php_syntax_check.js

      - name: Blade syntax
        run: node deploy/dev/audit/blade_syntax_check.js

      - name: Route integrity
        run: node deploy/dev/audit/routes_integrity_check.js

      - name: Route and view references
        run: node deploy/dev/audit/route_reference_check.js

      - name: Icons referenced exist in the sprite
        run: python3 deploy/dev/audit/icons_reference_check.py

      - name: Application health checks
        run: python3 deploy/dev/audit/application_health_check.py

  package:
    name: cPanel package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The build script refuses to run on a dirty tree — exactly what CI wants.
      - name: Build the cPanel ZIP
        run: bash deploy/package-cpanel.sh --out "$RUNNER_TEMP/dist"

      - name: Assert the ZIP carries no internal audit reports or dev runtime
        run: |
          ZIP=$(ls "$RUNNER_TEMP/dist"/*.zip)
          echo "Built: $ZIP"
          forbidden='nowills-pms/docs/AUDIT|nowills-pms/docs/NOWILLS-PMS-CODEBASE-AUDIT|nowills-pms/docs/TEST-STATUS|nowills-pms/deploy/dev/|nowills-pms/tests/|nowills-pms/\.github/|nowills-pms/phpunit\.xml'
          if unzip -l "$ZIP" | grep -E "$forbidden"; then
            echo "::error::The cPanel package contains files it must not ship"
            exit 1
          fi
          for wanted in 'build/vendor/laravel/framework/composer.json' 'public/index.php' 'START-HERE.txt'; do
            if ! unzip -l "$ZIP" | grep -q "$wanted"; then
              echo "::error::The cPanel package is missing $wanted"
              exit 1
            fi
          done
          echo "Package contents OK"
