<VirtualHost *:80>
    ServerName pms.example.com
    DocumentRoot /var/www/nowills-pms/public
    <Directory /var/www/nowills-pms/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/nowills-pms-error.log
    CustomLog ${APACHE_LOG_DIR}/nowills-pms-access.log combined
</VirtualHost>
