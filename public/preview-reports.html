"Channel Manager":"📡","Compliance & HSE":"🛡","Concierge & Activities":"🗺","F&B & POS":"🍽",
"Feedback & Reputation":"⭐","Fixed Assets & Engineering":"🔧","Food Safety":"🌡",
"Foreign Guests & Forex":"💱","Front Office":"🛎","General Ledger":"📊","Guest Messaging":"💬",
"HR & People":"👥","Health Club & Spa":"🏋","Hotel Group & Owner Reporting":"🏢",
"Hotel Interfaces":"🔌","Housekeeping":"🧹","IPTV & Guest Technology":"📺",
"Inventory & Purchasing":"📦","Laundry & Linen":"👔","Learning & Development":"📚",
"Management & MIS":"📈","Marketing & CRM":"📧","Partner & Organiser Portals":"🌐",
"Payroll":"💸","Property & Utilities":"⚡","Quality Assurance":"✓","Revenue Management":"📈",

"Sustainability & ESG":"🌱","System & Administration":"⚙","Talent Management":"🎯",
"Tax & Statutory":"🧾","Transport & Parking":"🚗","Treasury & Payments":"🏦",
};

const grid = document.getElementById('reportGrid');
const search = document.getElementById('reportSearch');
const tabsContainer = document.getElementById('filterTabs');

function getFilteredReports(query) {
  if (!query) return REPORTS;
  const q = query.toLowerCase();
  return REPORTS.filter(r => r[1].toLowerCase().includes(q) || r[2].toLowerCase().includes(q) || r[0].toLowerCase().includes(q));
}

function renderTabs(categories, activeCategory) {
  tabsContainer.innerHTML = '';
  const allTab = document.createElement('div');
  allTab.className = 'filter-tab' + (activeCategory === 'all' ? ' active' : '');
  allTab.textContent = 'All ' + REPORTS.length + ' reports';
  allTab.onclick = () => renderReports('', 'all');
  tabsContainer.appendChild(allTab);
  categories.forEach(cat => {
    const tab = document.createElement('div');
    const count = REPORTS.filter(r => r[0] === cat).length;
    tab.className = 'filter-tab' + (activeCategory === cat ? ' active' : '');
    tab.textContent = cat + ' (' + count + ')';
    tab.onclick = () => renderReports(cat, cat);
    tabsContainer.appendChild(tab);
  });
}

function renderReports(query, activeCategory) {
  let filtered;
  if (activeCategory && activeCategory !== 'all') {
    filtered = REPORTS.filter(r => r[0] === activeCategory);
    if (query) {
      const q = query.toLowerCase();
      filtered = filtered.filter(r => r[1].toLowerCase().includes(q) || r[2].toLowerCase().includes(q));
    }
  } else {
    filtered = getFilteredReports(query);
  }

  // Group by category
  const groups = {};
  filtered.forEach(r => { (groups[r[0]] = groups[r[0]] || []).push(r); });

  grid.innerHTML = '';
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="no-results">No reports match your search.</div>';
    return;
  }

  Object.keys(groups).sort().forEach(cat => {
    const card = document.createElement('div');
    card.className = 'report-card';
    const icon = CATEGORY_ICONS[cat] || '📄';
    card.innerHTML = '<div class="report-card-head"><h3>' + icon + ' ' + cat + '</h3><span class="count">' + groups[cat].length + '</span></div><div class="report-list">';
    groups[cat].forEach(r => {
      card.innerHTML += '<div class="report-item"><div class="report-item-icon">' + icon + '</div><div class="report-item-body"><div class="report-item-name">' + r[1] + '</div><div class="report-item-desc">' + r[2] + '</div></div><div class="report-item-arrow">›</div></div>';
    });
    card.innerHTML += '</div>';
    grid.appendChild(card);
  });
}

// Initial render
const allCategories = [...new Set(REPORTS.map(r => r[0]))].sort();
renderTabs(allCategories, 'all');
renderReports('', 'all');

// Search
search.addEventListener('input', () => {
  const q = search.value;
  const categories = [...new Set(getFilteredReports(q).map(r => r[0]))].sort();
  renderTabs(categories, 'all');
  renderReports(q, 'all');
});
</script>
